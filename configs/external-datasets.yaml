version: 1
sources:
  celeba-spoof:
    homepage: https://github.com/ZhangYuanhan-AI/CelebA-Spoof
    downloads: https://drive.google.com/drive/folders/1OW_1bawO79pRqdVEVmBzp8HSxdSwln_Z
    terms: non-commercial research only; no redistribution
    annotation_format: official path-to-44-attributes JSON
    binary_label_index: 43
    source_label_map: {0: live, 1: spoof}
    project_label_map: {0: fake, 1: real}
    source_to_project: {0: 1, 1: 0}
    capture_provenance: explicit evidenced sidecar; missing fields quarantine
    use_for_live_authorization: false
  oulu-npu:
    homepage: https://sites.google.com/site/oulunpudatabase/
    access: institutional EULA; user must obtain access; no automatic acceptance
    adapter_status: not implemented
    use_for_live_authorization: false
import_policy:
  private_root: data/external
  default_sample_limit: 200
  max_sample_limit: 10000
  download_budget_bytes: 200000000
  target_ratios: {train: 0.70, val: 0.15, test: 0.15}
  official_protocol: preserved separately, never presented as strict-v2 release
  custom_protocol: group-disjoint candidates requiring shortcut/release audit
  preprocessing: BGR uint8 128x128 PNG, float32 /255 at load
  existing_releases: never overwrite
